name: CI

on:
  push:
    branches: [main]
    paths:
      - 'booking_system_backend/**'
      - 'booking_system_frontend/**'
      - 'booking_system_inventory_hold_service/**'
      - 'e2e/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'booking_system_backend/**'
      - 'booking_system_frontend/**'
      - 'booking_system_inventory_hold_service/**'
      - 'e2e/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Python backend unit tests (SQLite in-memory, no Docker needed)
  # ─────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking_system_backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: booking_system_backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: booking_system_backend/coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend — TypeScript type-check, ESLint, and Vite production build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking_system_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: booking_system_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        # VITE_API_URL=/api matches the nginx proxy config used in Docker images
        run: VITE_API_URL=/api npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: booking_system_frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Java hold service — Maven compile + test (no Docker needed)
  # ─────────────────────────────────────────────────────────────────────────
  java-build:
    name: Java hold service — Maven build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking_system_inventory_hold_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hold-service-jar
          path: booking_system_inventory_hold_service/target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: E2E tests — full stack via docker-compose.e2e.yml
  # Runs after unit jobs pass; builds images from source.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — smoke + holds
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, java-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 (for pytest runner)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install e2e test dependencies
        run: pip install -r e2e/requirements.txt

      - name: Build and start e2e stack
        run: |
          docker compose \
            -p galaxium_e2e \
            -f e2e/docker-compose.e2e.yml \
            up -d --build
        # Both images build from source; Java Maven build can be slow on first run.
        timeout-minutes: 15

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18001/ > /dev/null 2>&1; then
              echo "Backend is up."
              break
            fi
            echo "  attempt $i/30 — retrying in 5s"
            sleep 5
          done
          curl -sf http://localhost:18001/ || (echo "Backend never became healthy" && exit 1)

      - name: Wait for Java hold service to be healthy
        run: |
          echo "Waiting for Java hold service..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18082/api/v1/health > /dev/null 2>&1; then
              echo "Java service is up."
              break
            fi
            echo "  attempt $i/30 — retrying in 5s"
            sleep 5
          done
          curl -sf http://localhost:18082/api/v1/health || (echo "Java service never became healthy" && exit 1)

      - name: Run e2e test suite
        env:
          E2E_BASE_URL: http://localhost:18001
          # Skip the ~90s auto-expiry test in CI to keep the job under 5 minutes.
          # Set E2E_RUN_SLOW=1 on a scheduled workflow if you want the full suite.
          E2E_RUN_SLOW: ""
        run: pytest e2e/ -v --tb=short

      - name: Print stack logs on failure
        if: failure()
        run: |
          docker compose -p galaxium_e2e -f e2e/docker-compose.e2e.yml logs

      - name: Tear down e2e stack
        if: always()
        run: |
          docker compose \
            -p galaxium_e2e \
            -f e2e/docker-compose.e2e.yml \
            down -v
