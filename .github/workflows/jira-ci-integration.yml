name: Jira CI Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Extract Jira issue key from the PR title
  # ───────────────────────────────────────────────────────────────────────────
  extract-ticket:
    name: Extract Jira ticket key
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      ticket: ${{ steps.parse.outputs.ticket }}
      has_ticket: ${{ steps.parse.outputs.has_ticket }}

    steps:
      - name: Parse ticket from PR title
        id: parse
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TICKET=$(echo "$PR_TITLE" | grep -oiE 'BIA-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')
          if [ -n "$TICKET" ]; then
            echo "ticket=$TICKET"   >> "$GITHUB_OUTPUT"
            echo "has_ticket=true"  >> "$GITHUB_OUTPUT"
            echo "Found Jira ticket: $TICKET"
          else
            echo "has_ticket=false" >> "$GITHUB_OUTPUT"
            echo "No Jira ticket found in: $PR_TITLE"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # On PR open/update: transition to In Review + post comment
  # ───────────────────────────────────────────────────────────────────────────
  notify-pr-opened:
    name: Jira — PR opened / updated
    runs-on: ubuntu-latest
    needs: extract-ticket
    if: |
      needs.extract-ticket.outputs.has_ticket == 'true' &&
      github.event.action != 'closed'

    steps:
      - name: Transition ticket to In Review
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ needs.extract-ticket.outputs.ticket }}
        run: |
          curl --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/2/issue/$TICKET/transitions" \
            -d '{"transition":{"id":"31"}}' || echo "Transition skipped"

      - name: Post PR link comment to Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ needs.extract-ticket.outputs.ticket }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ACTION_LABEL="opened"
          [ "$PR_ACTION" = "synchronize" ] && ACTION_LABEL="updated"
          [ "$PR_ACTION" = "reopened"    ] && ACTION_LABEL="reopened"

          # Use python3 for safe JSON body generation (no heredoc quoting issues)
          BODY=$(python3 -c "
import json, os
body = (
    f'PR {os.environ[\"ACTION_LABEL\"]} by @{os.environ[\"PR_AUTHOR\"]}\n\n'
    f'PR: {os.environ[\"PR_TITLE\"]}\n'
    f'Link: {os.environ[\"PR_URL\"]}\n\n'
    f'CI pipeline: {os.environ[\"RUN_URL\"]}\n'
    f'Branch: {os.environ[\"HEAD_REF\"]} -> {os.environ[\"BASE_REF\"]}'
)
print(json.dumps({'body': body}))
" ACTION_LABEL="$ACTION_LABEL")

          curl --silent --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/2/issue/$TICKET/comment" \
            -d "$BODY"
          echo "Comment posted to $TICKET"

  # ───────────────────────────────────────────────────────────────────────────
  # On PR merge: post merged comment
  # ───────────────────────────────────────────────────────────────────────────
  notify-pr-merged:
    name: Jira — PR merged
    runs-on: ubuntu-latest
    needs: extract-ticket
    if: |
      needs.extract-ticket.outputs.has_ticket == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    steps:
      - name: Post merged comment to Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ needs.extract-ticket.outputs.ticket }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          SHORT_SHA="${MERGE_SHA:0:7}"
          COMMITS_URL="${{ github.server_url }}/${{ github.repository }}/commit/$MERGE_SHA"

          BODY=$(python3 -c "
import json, os
body = (
    f'PR merged by @{os.environ[\"MERGED_BY\"]}\n\n'
    f'PR: {os.environ[\"PR_TITLE\"]}\n'
    f'Link: {os.environ[\"PR_URL\"]}\n\n'
    f'Merge commit: {os.environ[\"SHORT_SHA\"]}\n'
    f'Target branch: {os.environ[\"BASE_REF\"]}'
)
print(json.dumps({'body': body}))
" SHORT_SHA="$SHORT_SHA" COMMITS_URL="$COMMITS_URL")

          curl --silent --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/2/issue/$TICKET/comment" \
            -d "$BODY"
          echo "Merge comment posted to $TICKET"

  # ───────────────────────────────────────────────────────────────────────────
  # After the CI workflow finishes: post pass/fail result to Jira
  # ───────────────────────────────────────────────────────────────────────────
  notify-ci-result:
    name: Jira — CI result
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'

    steps:
      - name: Get PR info for this workflow run
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          PR_DATA=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/pull_requests" \
            | python3 -c "
import json,sys
data=json.load(sys.stdin)
if data:
    pr=data[0]
    print(f'title={pr[\"title\"]}')
    print(f'url={pr[\"html_url\"]}')
else:
    print('title=')
    print('url=')
")

          PR_TITLE=$(echo "$PR_DATA" | grep '^title=' | cut -d= -f2-)
          PR_URL=$(echo "$PR_DATA" | grep '^url='   | cut -d= -f2-)
          TICKET=$(echo "$PR_TITLE" | grep -oiE 'BIA-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')

          echo "ticket=$TICKET"   >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL"   >> "$GITHUB_OUTPUT"
          echo "has_ticket=$([ -n '$TICKET' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Post CI pass comment
        if: |
          steps.pr_info.outputs.has_ticket == 'true' &&
          github.event.workflow_run.conclusion == 'success'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ steps.pr_info.outputs.ticket }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_URL: ${{ steps.pr_info.outputs.pr_url }}
        run: |
          BODY=$(python3 -c "
import json, os
body = (
    'CI PASSED - all checks green\n\n'
    f'Pipeline: {os.environ[\"RUN_URL\"]}\n'
    f'PR: {os.environ[\"PR_URL\"]}\n\n'
    'Jobs:\n'
    '  Backend pytest:        PASS\n'
    '  Frontend lint + build: PASS\n'
    '  Java Maven build:      PASS\n'
    '  E2E smoke + holds:     PASS'
)
print(json.dumps({'body': body}))
")
          curl --silent --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/2/issue/$TICKET/comment" \
            -d "$BODY"

      - name: Post CI failure comment
        if: |
          steps.pr_info.outputs.has_ticket == 'true' &&
          github.event.workflow_run.conclusion == 'failure'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ steps.pr_info.outputs.ticket }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_URL: ${{ steps.pr_info.outputs.pr_url }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          BODY=$(python3 -c "
import json, os
body = (
    'CI FAILED - review required\n\n'
    f'Failed run: {os.environ[\"RUN_URL\"]}\n'
    f'PR: {os.environ[\"PR_URL\"]}\n'
    f'Triggered by: @{os.environ[\"ACTOR\"]}\n\n'
    'Check the run logs and push a fix to unblock the PR.'
)
print(json.dumps({'body': body}))
")
          curl --silent --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/2/issue/$TICKET/comment" \
            -d "$BODY"
